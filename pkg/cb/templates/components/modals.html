{{define "modals"}}
<!-- FLOATING TOAST NOTIFICATION CONTAINER -->
<div id="cbToastContainer" class="cb-toast-container"></div>

<!-- LIGHTBOX PREVIEW MODAL -->
<div id="cbLightbox" class="lightbox-backdrop" style="display: none;" onclick="closeLightbox()">
  <img id="cbLightboxImg" class="lightbox-img" src="" alt="Preview">
</div>

<!-- QUICK SEARCH COMMAND PALETTE MODAL (CTRL+K) -->
<div id="cmdPalette" class="cmd-palette-backdrop" style="display: none;" onclick="if(event.target===this) toggleCmdPalette()">
  <div class="cmd-palette-modal">
    <div class="cmd-search-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="cmd-search-icon"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="cmdInput" class="cmd-input" placeholder="Jump to module, action or setting... (ESC to close)" onkeyup="filterCmdPalette()">
      <kbd class="cmd-kbd">ESC</kbd>
    </div>
    <div class="cmd-results" id="cmdResults">
      <div class="cmd-group-label">NAVIGATION</div>
      <a href="{{.AdminPath}}" class="cmd-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg> Executive Dashboard</a>
      {{range .MenuItems}}
        {{if eq .Type "dropdown"}}
          {{range .Children}}
            <a href="{{.Path}}" class="cmd-item">{{.Icon | safeHTML}} {{.Title}}</a>
          {{end}}
        {{else if ne .Type "header"}}
          <a href="{{.Path}}" class="cmd-item">{{.Icon | safeHTML}} {{.Title}}</a>
        {{end}}
      {{end}}
    </div>
  </div>
</div>
{{end}}
