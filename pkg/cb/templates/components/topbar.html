{{define "topbar"}}
<header class="cb-topbar">
  <div class="cb-topbar-left">
    <!-- MOBILE HAMBURGER TOGGLE -->
    <button type="button" class="btn-mobile-toggle" onclick="toggleMobileSidebar()" aria-label="Toggle navigation menu" title="Toggle navigation">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <!-- BREADCRUMB -->
    <div class="cb-breadcrumb">
      <a href="{{.AdminPath}}" class="breadcrumb-root">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Dashboard</span>
      </a>
      <span class="breadcrumb-separator">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </span>
      <span class="breadcrumb-current">{{.PageTitle}}</span>
    </div>
  </div>

  <!-- TOPBAR ACTIONS -->
  <div class="cb-topbar-right">
    <!-- QUICK SEARCH TRIGGER -->
    <button type="button" class="btn-search-trigger" onclick="toggleCmdPalette()" title="Press Ctrl+K to search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span class="search-trigger-text">Search modules...</span>
      <kbd class="kbd-badge">Ctrl K</kbd>
    </button>

    <!-- THEME TOGGLE (LIGHT / DARK) -->
    <button type="button" class="btn-theme-toggle" onclick="toggleTheme()" title="Toggle Light / Dark mode" aria-label="Toggle theme">
      <svg class="theme-icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="theme-icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <!-- LIVE TELEMETRY BEACON -->
    <div class="latency-beacon" title="TGo zero-alloc HTTP/2 kernel">
      <span class="beacon-dot"></span>
      <span class="beacon-text">0.38 ms TTFB</span>
    </div>

    <!-- USER PILL -->
    <div class="cb-user-pill">
      <div class="cb-avatar">{{.UserInitials}}</div>
      <span class="cb-user-pill-name">{{.User.Name}}</span>
    </div>

    <!-- LOGOUT -->
    <a href="{{.AdminPath}}/logout" class="btn-topbar-logout" title="Sign out">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>
      </svg>
    </a>
  </div>
</header>
{{end}}
