{{define "topbar"}}
<header class="cb-topbar">
  <div class="cb-breadcrumb">
    <a href="{{.AdminPath}}" style="color: inherit; text-decoration: none;">Dashboard</a>
    <span class="separator">/</span>
    <span class="current">{{.PageTitle}}</span>
  </div>

  <div class="cb-topbar-right">
    <div class="latency-beacon">
      <span class="beacon-dot"></span>
      <span>0.38 ms TTFB • HTTP/2 h2c</span>
    </div>

    <div class="cb-user-pill">
      <div class="cb-avatar" style="width: 26px; height: 26px; font-size: 0.72rem;">{{.UserInitials}}</div>
      <span style="font-size: 0.84rem; font-weight: 700;">{{.User.Name}}</span>
    </div>

    <a href="{{.AdminPath}}/logout" class="btn-logout">Logout</a>
  </div>
</header>
{{end}}
